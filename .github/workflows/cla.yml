# The contributor licence agreement (CLA.md): the bot asks each new contributor to sign once, in a comment
# on their pull request, and records it in the cla-signatures branch. It never checks out or runs the
# pull request's code.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/AlexCJK1/nightdesk/blob/main/CLA.md
          branch: cla-signatures
          allowlist: AlexCJK1,dependabot[bot]
